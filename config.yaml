# Video Subtitle Auto-Translation — Configuration
# See SPECIFICATIONS.md for the full description of every option.
# Secrets (API keys) live in config.local.yaml, NOT here.
# The default translation prompts (system_prompt / system_prompt_extended)
# live in config.prompt.yaml, NOT here.

output:
  # Where subtitles are written when there is no natural "next to the source" location
  # (used as a fallback / base output dir)
  output_directory: "./output"
  # Where YouTube / m3u8 downloads are saved
  video_download_directory: 'C:\Temp'
  # Subtitle format (only srt is implemented)
  subtitle_format: "srt"

translation:
  # Active service: "deepl" or "openai" (recommended default)
  service: "openai"
  source_language: "ja"
  target_language: "fr"
  retry:
    max_retries: 8
    initial_delay_seconds: 2.0
    max_delay_seconds: 60.0
    backoff_multiplier: 2.0
    jitter_ratio: 0.2
  deepl:
    plan: "free" # "free" or "pro"
  openai:
    model: "gpt-4o"
    batch_size: 10
  api_keys:
    deepl: ""
    openai: ""
  custom_prompts:
    enable: true
    # system_prompt / system_prompt_extended are defined in config.prompt.yaml
    user_prompt_template: "{text}"

speech_recognition:
  engine: "whisper"
  # tiny, base, small, medium, large, turbo
  whisper_model: "large"
  max_segment_length: 45
  confidence_threshold: 0.2

audio:
  extraction_format: "wav"
  sample_rate: 16000
  channels: 1
  normalize_volume: true

video:
  # Leave empty to use ffmpeg/ffprobe from PATH
  ffmpeg_path: ""
  temp_directory: "./temp"
  # JavaScript runtime required by yt-dlp to solve YouTube extraction challenges
  youtube_js_runtime:
    runtime: "node" # leave blank to rely on yt-dlp defaults (deno)
    path: ""        # absolute path to the runtime executable; blank if on PATH
  youtube_remote_components:
    enable: true
    components:
      - "ejs:github"
  # YouTube player clients yt-dlp should query (in order). Includes "tv" alongside the default
  # clients because YouTube's "SABR-only streaming" rollout (see SPECIFICATIONS.md section 4.2)
  # can cause some default clients (e.g. android_vr) to expose only low-resolution formats;
  # "tv" is unaffected as of this writing. Leave empty to use yt-dlp's own default client list.
  youtube_player_clients: ["default", "tv"]
  # Total attempts (including the first) when the downloaded YouTube quality is degraded or a
  # SABR-related warning is detected. YouTube's SABR rollout is applied per-request/session, so
  # retrying is effectively a new roll of the dice each time (see SPECIFICATIONS.md section 4.2).
  youtube_quality_max_attempts: 3

processing:
  log_level: "INFO"
  show_progress: true
  # Also write the full log of the current run to a file (in addition to the console), so it can
  # be inspected/shared after the fact without having to copy-paste the terminal. The file is
  # overwritten at the start of each run (kept only until the next run starts).
  log_to_file: true
  log_file_path: "./temp/logs/last_run.log"
  chapter_autoselect_patterns:
    - "^MC"
    - "^Intro$"
    - "^Outro$"
  clean_temp_on_start: true
  # How many days of old ./temp/run_* directories to keep before pruning
  temp_keep_days: 2

advanced:
  gpu_acceleration: false
  gpu_device: 0
