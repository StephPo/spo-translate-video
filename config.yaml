# Video Subtitle Auto-Translation — Configuration
# See SPECIFICATIONS.md for the full description of every option.
# Secrets (API keys) live in config.local.yaml, NOT here.
# The default translation prompts (system_prompt / system_prompt_extended)
# live in config.prompt.yaml, NOT here.

output:
  # Where subtitles are written when there is no natural "next to the source" location
  # (used as a fallback / base output dir)
  output_directory: "./output"
  # Where YouTube / m3u8 downloads are saved
  video_download_directory: 'C:\Temp'
  # Subtitle format (only srt is implemented)
  subtitle_format: "srt"

translation:
  # Active service: "deepl" or "openai" (recommended default)
  service: "openai"
  source_language: "ja"
  target_language: "fr"
  retry:
    max_retries: 8
    initial_delay_seconds: 2.0
    max_delay_seconds: 60.0
    backoff_multiplier: 2.0
    jitter_ratio: 0.2
  deepl:
    plan: "free" # "free" or "pro"
  openai:
    model: "gpt-4o"
    batch_size: 10
  api_keys:
    deepl: ""
    openai: ""
  custom_prompts:
    enable: true
    # system_prompt / system_prompt_extended are defined in config.prompt.yaml
    user_prompt_template: "{text}"

speech_recognition:
  engine: "whisper"
  # faster-whisper model (SPECIFICATIONS.md section 3.6): tiny, base, small, medium, large-v3 (= large),
  # turbo (much faster, close quality), distil-large-v3, or a Hugging Face CTranslate2 repo id, e.g.
  # "kotoba-tech/kotoba-whisper-v2.0-faster" (fast, Japanese-specialised). On a laptop without NVIDIA GPU,
  # override it in config.local.yaml (e.g. "turbo").
  whisper_model: "large-v3"
  # auto = float16 on GPU, int8 on CPU (8-bit: big speed-up on CPU, negligible quality loss)
  compute_type: "auto"
  # CPU threads; 0 = half the logical CPUs (~ physical cores)
  cpu_threads: 0
  # Skip silence / music-only stretches before decoding (Silero VAD): faster, but may drop speech
  # over background music. Off by default (SPECIFICATIONS.md section 3.6).
  vad_filter: false
  # 1 = greedy (fastest); 5 = slightly better quality, slower
  beam_size: 1
  # Word-level alignment to refine segment start/end; false saves time on slow machines
  word_timestamps: true
  max_segment_length: 45
  confidence_threshold: 0.2
  # Feed the previous 30 s window's text as context to the next one (Whisper default: true).
  # false avoids repetition loops on long videos that lose whole 30 s chunks of speech.
  condition_on_previous_text: false
  # Re-transcribe in isolation the regions whose segments were dropped (low confidence),
  # to recover speech lost when a whole 30 s decoding window went wrong.
  recover_dropped_regions: true

audio:
  extraction_format: "wav"
  sample_rate: 16000
  channels: 1
  normalize_volume: true

video:
  # Leave empty to use ffmpeg/ffprobe from PATH
  ffmpeg_path: ""
  temp_directory: "./temp"
  # JavaScript runtime required by yt-dlp to solve YouTube extraction challenges
  youtube_js_runtime:
    runtime: "node" # leave blank to rely on yt-dlp defaults (deno)
    path: ""        # absolute path to the runtime executable; blank if on PATH
  youtube_remote_components:
    enable: true
    components:
      - "ejs:github"
  # YouTube player clients yt-dlp should query (in order). Includes "tv" alongside the default
  # clients because YouTube's "SABR-only streaming" rollout (see SPECIFICATIONS.md section 4.2)
  # can cause some default clients (e.g. android_vr) to expose only low-resolution formats;
  # "tv" is unaffected as of this writing. Leave empty to use yt-dlp's own default client list.
  youtube_player_clients: ["default", "tv"]
  # Total attempts (including the first) when the downloaded YouTube quality is degraded or a
  # SABR-related warning is detected. YouTube's SABR rollout is applied per-request/session, so
  # retrying is effectively a new roll of the dice each time (see SPECIFICATIONS.md section 4.2).
  youtube_quality_max_attempts: 3

processing:
  log_level: "INFO"
  show_progress: true
  # Also write the full log of the current run to a file (in addition to the console), so it can
  # be inspected/shared after the fact without having to copy-paste the terminal. The file is
  # overwritten at the start of each run (kept only until the next run starts).
  log_to_file: true
  log_file_path: "./temp/logs/last_run.log"
  chapter_autoselect_patterns:
    - "^MC"
    - "^Intro$"
    - "^Outro$"
  clean_temp_on_start: true
  # How many days of old ./temp/run_* directories to keep before pruning
  temp_keep_days: 2

pedro_education_club:
  # Shared by every script targeting the sp.pedro.tokyo fan club site (SPECIFICATIONS.md section 3.12).
  # login / password go in config.local.yaml (same section name), NOT here.
  base_url: "https://sp.pedro.tokyo"
  # The site only works with a mobile browser User-Agent
  user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"

pedro_shitsumons:
  # spo_pedro_shitsumons.bat / pedro_shitsumons.py (SPECIFICATIONS.md section 3.12).
  list_path: "/qa/list/1/"
  # Max list pages scanned (stops earlier at the first non-NEW message)
  max_pages: 20
  request_delay_seconds: 0.5
  output_directory: "./output/pedro_shitsumons"
  temp_directory: "./temp/pedro_shitsumons"
  # Open the generated .md file at the end
  open_output: true

pedro_fanstream:
  # spo-pedro-fanstream.bat / pedro_fanstream.py (SPECIFICATIONS.md section 3.13).
  list_path: "/movies/list/5/0/"
  # The latest movie whose title matches this regex is processed
  title_pattern: "生配信"
  # Network drive: must be reachable from the current Windows session (use a UNC path if needed)
  output_directory: 'Z:\PEDRO\FC Stream'
  # {date} = publication date in the movie list, AAAAMMJJ
  filename_template: "{date} FC stream"
  # Key of config.prompt.yaml used instead of system_prompt_extended
  prompt_key: "pedro_fanstream_prompt_extended"
  request_delay_seconds: 0.5

advanced:
  # "auto" = NVIDIA GPU (CUDA) if available and working, else CPU; true = want GPU (CPU fallback
  # with a warning); false = always CPU
  gpu_acceleration: "auto"
  gpu_device: 0
